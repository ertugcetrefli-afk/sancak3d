<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Dönüştürücü - GLB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .upload-section {
            padding: 40px;
            background: linear-gradient(to bottom, #f8f9fa, #ffffff);
            border-bottom: 2px solid #e9ecef;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f0ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-area h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .upload-area p {
            color: #666;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(86, 171, 47, 0.4);
        }

        .viewer-section {
            padding: 40px;
            display: none;
        }

        .viewer-section.active {
            display: block;
        }

        #viewer-container {
            width: 100%;
            height: 500px;
            background: #f8f9fa;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .info-box h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #666;
            font-weight: 600;
        }

        .info-value {
            color: #333;
        }

        .status-message {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 600;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .embed-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .embed-code {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .supported-formats {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .format-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 3D Model Dönüştürücü</h1>
            <p>3D modellerinizi GLB formatına dönüştürün ve web sitenizde sergileyin</p>
        </div>

        <div class="main-card">
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📦</div>
                    <h3>3D Modelinizi Yükleyin</h3>
                    <p>Dosyayı buraya sürükleyin veya tıklayarak seçin</p>
                    <input type="file" id="fileInput" class="file-input" accept=".obj,.fbx,.stl,.gltf,.glb,.dae,.ply">
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        Dosya Seç
                    </button>
                </div>

                <div class="supported-formats">
                    <span class="format-badge">OBJ</span>
                    <span class="format-badge">FBX</span>
                    <span class="format-badge">STL</span>
                    <span class="format-badge">GLB</span>
                    <span class="format-badge">GLTF</span>
                    <span class="format-badge">DAE</span>
                    <span class="format-badge">PLY</span>
                </div>

                <div id="statusMessage"></div>
            </div>

            <div class="viewer-section" id="viewerSection">
                <h3 style="text-align: center; margin-bottom: 20px; color: #333;">3D Model Görüntüleyici</h3>

                <div id="viewer-container"></div>

                <div class="controls">
                    <button class="btn btn-success" id="downloadBtn">
                        💾 GLB İndir
                    </button>
                    <button class="btn btn-primary" id="embedBtn">
                        🔗 Embed Kodu Al
                    </button>
                    <button class="btn btn-primary" id="resetBtn">
                        🔄 Yeni Model Yükle
                    </button>
                </div>

                <div class="info-box" id="modelInfo" style="display: none;">
                    <h4>Model Bilgileri</h4>
                    <div id="infoContent"></div>
                </div>

                <div class="embed-section" id="embedSection" style="display: none;">
                    <h4 style="margin-bottom: 15px;">Embed Kodu (Sitenize ekleyin)</h4>
                    <div class="embed-code" id="embedCode"></div>
                    <button class="btn btn-primary" style="margin-top: 15px;" onclick="copyEmbedCode()">
                        📋 Kodu Kopyala
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="GLTFLoader.js"></script>
    <script src="converter.js"></script>
    <script src="app.js"></script>
</body>
</html>
