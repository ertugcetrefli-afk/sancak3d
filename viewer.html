<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Görüntüleyici - Örnek</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        #model-viewer {
            width: 100%;
            height: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .info {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .info h3 {
            margin-top: 0;
            color: #667eea;
        }

        .controls {
            background: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .controls label {
            display: inline-block;
            margin: 0 10px;
            color: #333;
        }

        .controls input[type="file"] {
            display: inline-block;
            padding: 10px;
            margin: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 3D Model Görüntüleyici</h1>

        <div id="model-viewer"></div>

        <div class="controls">
            <label>
                Model Seç:
                <input type="file" id="modelInput" accept=".glb,.gltf">
            </label>
            <button class="btn" onclick="resetCamera()">🎯 Kamerayı Sıfırla</button>
            <button class="btn" onclick="toggleRotation()">🔄 Otomatik Dönüş</button>
        </div>

        <div class="info">
            <h3>Kullanım Talimatları</h3>
            <ul>
                <li><strong>Fare Sol Tuş:</strong> Modeli döndür</li>
                <li><strong>Fare Tekerleği:</strong> Yakınlaş/Uzaklaş</li>
                <li><strong>Fare Sağ Tuş:</strong> Kamerayı kaydır</li>
                <li><strong>Dosya Seç:</strong> Kendi GLB modelinizi yükleyin</li>
            </ul>
            <p><em>Bu görüntüleyiciyi kendi web sitenize entegre edebilirsiniz!</em></p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r159/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // Scene kurulum
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        const container = document.getElementById('model-viewer');
        const camera = new THREE.PerspectiveCamera(
            45,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 1;
        controls.maxDistance = 50;

        // Işıklar
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(5, 10, 7.5);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-5, 10, -7.5);
        scene.add(dirLight2);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.3);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        // Grid yardımcı
        const gridHelper = new THREE.GridHelper(10, 10, 0xcccccc, 0xeeeeee);
        scene.add(gridHelper);

        let currentModel = null;
        let autoRotate = false;

        // Varsayılan model yükle (varsa)
        const defaultModels = ['barist3d.glb', 'baron.glb', 'Masason1.glb'];
        let modelLoaded = false;

        for (let modelName of defaultModels) {
            loadModel(modelName);
            break; // İlk bulunanı yükle
        }

        // Model yükleme fonksiyonu
        function loadModel(path) {
            const loader = new THREE.GLTFLoader();

            loader.load(
                path,
                function(gltf) {
                    // Eski modeli kaldır
                    if (currentModel) {
                        scene.remove(currentModel);
                    }

                    currentModel = gltf.scene;

                    // Modeli merkeze al ve ölçeklendir
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    currentModel.position.x = -center.x;
                    currentModel.position.y = -center.y;
                    currentModel.position.z = -center.z;

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 5 / maxDim;
                    currentModel.scale.set(scale, scale, scale);

                    scene.add(currentModel);
                    modelLoaded = true;
                },
                function(xhr) {
                    console.log((xhr.loaded / xhr.total * 100) + '% yüklendi');
                },
                function(error) {
                    if (!modelLoaded) {
                        console.log('Varsayılan model yüklenemedi');
                    }
                }
            );
        }

        // Dosya yükleme
        document.getElementById('modelInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    const loader = new THREE.GLTFLoader();

                    loader.parse(arrayBuffer, '', function(gltf) {
                        if (currentModel) {
                            scene.remove(currentModel);
                        }

                        currentModel = gltf.scene;

                        // Modeli merkeze al ve ölçeklendir
                        const box = new THREE.Box3().setFromObject(currentModel);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());

                        currentModel.position.x = -center.x;
                        currentModel.position.y = -center.y;
                        currentModel.position.z = -center.z;

                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 5 / maxDim;
                        currentModel.scale.set(scale, scale, scale);

                        scene.add(currentModel);
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });

        // Animasyon
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Otomatik dönüş
            if (autoRotate && currentModel) {
                currentModel.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }
        animate();

        // Kamerayı sıfırla
        function resetCamera() {
            camera.position.set(0, 5, 10);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // Otomatik dönüş
        function toggleRotation() {
            autoRotate = !autoRotate;
        }

        // Responsive
        window.addEventListener('resize', function() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
